<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nimbus CRM — Demo</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --ink:#16181d; --muted:#6b7280; --line:#e5e7eb;
    --brand:#2f5fe0; --brand-ink:#1b3fa8; --side:#141a2b; --side-ink:#aab2c8;
    --ok:#0f9d58; --warn:#d97706; --bad:#dc2626; --chip:#eef2ff;
    --radius:10px; --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.05);
    /* theme surfaces */
    --btn-bg:#fff; --hover-bg:#fbfbfc; --hover-line:#c9ced8; --input-bg:#fff;
    --th-bg:#fafbfc; --row-hover:#fafbff; --bar-bg:#eef0f4; --deal-bg:#fff; --modal-bg:#fff;
    --focus:#cfdcff; --avatar-bg:#e8efff; --over-bg:#e8efff; --col-ink:#4b5563;
    --t-grey-bg:#f1f2f4; --t-grey-ink:#4b5563;
    --t-blue-bg:#e8efff; --t-blue-ink:#1b3fa8;
    --t-green-bg:#e6f6ec; --t-green-ink:#0b6b3e;
    --t-amber-bg:#fdf1dc; --t-amber-ink:#92400e;
    --t-red-bg:#fdeaea; --t-red-ink:#9b1c1c;
    --t-purple-bg:#f1e9ff; --t-purple-ink:#5b21b6;
    --banner-bg:#fff8e6; --banner-line:#f5dfae; --banner-ink:#7c5b12;
    --err-bg:#fdeaea; --err-ink:#9b1c1c; --err-line:#f5c6c6;
    --toast-bg:#16181d; --toast-ink:#fff;
  }
  :root[data-theme="dark"]{
    --bg:#0d1017; --panel:#171c25; --ink:#e8ebf1; --muted:#98a1b3; --line:#262d3a;
    --brand:#4c7cff; --brand-ink:#a3bcf7; --side:#090c12; --side-ink:#8b94a8;
    --ok:#34c273; --warn:#f0a13a; --bad:#f26d6d; --chip:#26304a;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3);
    --btn-bg:#202634; --hover-bg:#262d3d; --hover-line:#343c4e; --input-bg:#0f131b;
    --th-bg:#141924; --row-hover:#1a2029; --bar-bg:#1d242f; --deal-bg:#1b212c; --modal-bg:#1b212c;
    --focus:#33508f; --avatar-bg:#26304a; --over-bg:#202c47; --col-ink:#aab3c4;
    --t-grey-bg:#232936; --t-grey-ink:#aab3c4;
    --t-blue-bg:#1c2944; --t-blue-ink:#9db8ff;
    --t-green-bg:#16301f; --t-green-ink:#6fd39a;
    --t-amber-bg:#33260f; --t-amber-ink:#f0c36e;
    --t-red-bg:#3a1c1c; --t-red-ink:#f09090;
    --t-purple-bg:#2a1f3f; --t-purple-ink:#c4a6ff;
    --banner-bg:#2b2410; --banner-line:#4a3d18; --banner-ink:#e5c66f;
    --err-bg:#3a1c1c; --err-ink:#f09090; --err-line:#5c2626;
    --toast-bg:#e8ebf1; --toast-ink:#16181d;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font:14px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); display:flex;
  }
  /* ---------- layout ---------- */
  aside{
    width:232px; flex:0 0 232px; background:var(--side); color:var(--side-ink);
    display:flex; flex-direction:column; padding:16px 12px; gap:2px; min-height:100vh;
  }
  .logo{display:flex;align-items:center;gap:9px;padding:6px 8px 18px;color:#fff;font-weight:650;letter-spacing:.2px}
  .logo i{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#4c7cff,#8b5cf6);display:inline-block}
  aside a{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:8px 10px;border-radius:8px;color:var(--side-ink);text-decoration:none;font-weight:500;
  }
  aside a:hover{background:rgba(255,255,255,.06);color:#fff}
  aside a.on{background:var(--brand);color:#fff}
  aside .grp{
    font:inherit;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#5f6a86;
    padding:14px 10px 6px;border:0;background:none;width:100%;display:flex;align-items:center;
    justify-content:space-between;cursor:pointer;text-align:left;font-weight:650
  }
  aside .grp:hover{color:#fff}
  aside .grp .chev{font-size:10px;opacity:.75;transition:transform .15s ease}
  aside .grp-items a{margin-left:8px}
  aside .count{font-size:11px;background:rgba(255,255,255,.12);border-radius:20px;padding:1px 7px}
  aside a.on .count{background:rgba(255,255,255,.25)}
  .sidefoot{margin-top:auto;padding:10px;font-size:11px;color:#5f6a86;line-height:1.45}

  main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;overflow:hidden}
  header{
    background:var(--panel);border-bottom:1px solid var(--line);padding:14px 24px;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap
  }
  header h1{font-size:18px;margin:0;font-weight:650}
  header .sub{color:var(--muted);font-size:12.5px}
  header .right{margin-left:auto;display:flex;gap:8px;align-items:center}
  #langbtn{min-width:46px;justify-content:center}
  #currsel{width:auto}
  #login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:60}
  .login-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:28px;width:100%;max-width:340px}
  .login-card h2{margin:0 0 16px;font-size:17px}
  .login-err{background:var(--err-bg);color:var(--err-ink);border:1px solid var(--err-line);border-radius:8px;padding:8px 10px;font-size:12.5px;margin-bottom:12px}
  .scroll{overflow:auto;padding:22px 24px 60px}

  /* ---------- bits ---------- */
  button,.btn{
    font:inherit;font-weight:550;border:1px solid var(--line);background:var(--btn-bg);color:var(--ink);
    padding:7px 12px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-flex;
    align-items:center;gap:6px;white-space:nowrap
  }
  button:hover,.btn:hover{border-color:var(--hover-line);background:var(--hover-bg)}
  .primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .primary:hover{background:var(--brand-ink);border-color:var(--brand-ink)}
  .ghost{background:transparent;border-color:transparent;color:var(--muted)}
  .danger{color:var(--bad)}
  .sm{padding:4px 9px;font-size:12.5px}
  input,select,textarea{
    font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--input-bg);
    color:var(--ink);width:100%
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--focus);border-color:var(--brand)}
  label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin:0 0 4px}
  .field{margin-bottom:12px}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row>*{flex:1;min-width:150px}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card .hd{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .card .hd h2{font-size:14px;margin:0;font-weight:650}
  .card .hd .right{margin-left:auto;display:flex;gap:8px}
  .card .bd{padding:16px}
  .grid{display:grid;gap:16px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
  .kpi .n{font-size:26px;font-weight:680;letter-spacing:-.5px;margin:2px 0 0}
  .kpi .l{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
  .kpi .d{font-size:12px;color:var(--muted);margin-top:6px}

  table{width:100%;border-collapse:collapse}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;
     padding:9px 16px;border-bottom:1px solid var(--line);background:var(--th-bg);white-space:nowrap}
  th.sortable{cursor:pointer;user-select:none}
  th.sortable:hover{color:var(--brand)}
  td{padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--row-hover)}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .link{color:var(--brand);cursor:pointer;font-weight:550}
  .link:hover{text-decoration:underline}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}

  .tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:650;
       background:var(--chip);color:var(--brand-ink);white-space:nowrap}
  .t-grey{background:var(--t-grey-bg);color:var(--t-grey-ink)}
  .t-blue{background:var(--t-blue-bg);color:var(--t-blue-ink)}
  .t-green{background:var(--t-green-bg);color:var(--t-green-ink)}
  .t-amber{background:var(--t-amber-bg);color:var(--t-amber-ink)}
  .t-red{background:var(--t-red-bg);color:var(--t-red-ink)}
  .t-purple{background:var(--t-purple-bg);color:var(--t-purple-ink)}
  .avatar{width:28px;height:28px;border-radius:50%;background:var(--avatar-bg);color:var(--brand-ink);
          display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;flex:0 0 28px}
  .with-av{display:flex;align-items:center;gap:9px}
  .empty{padding:36px;text-align:center;color:var(--muted)}
  .muted{color:var(--muted)}
  .bar{height:6px;border-radius:6px;background:var(--bar-bg);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--brand)}

  /* pipeline */
  .board{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
  .col{flex:0 0 250px;background:var(--bar-bg);border-radius:10px;padding:9px;min-height:150px}
  .col.over{outline:2px dashed var(--brand);background:var(--over-bg)}
  .col h3{font-size:12px;margin:2px 4px 9px;text-transform:uppercase;letter-spacing:.05em;color:var(--col-ink);
          display:flex;justify-content:space-between}
  .deal{background:var(--deal-bg);border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:8px;
        cursor:grab;box-shadow:0 1px 1px rgba(16,24,40,.04)}
  .deal:active{cursor:grabbing}
  .deal .t{font-weight:600;margin-bottom:3px}
  .deal .m{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px;margin-top:6px}
  .deal .actions{display:flex;gap:6px}
  /* compact board — smaller minimalist cards */
  .board.compact .col{flex:0 0 185px}
  .board.compact .deal{padding:6px 8px;margin-bottom:5px}
  .board.compact .deal .t{font-size:12.5px;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .board.compact .deal .muted{display:none}
  .board.compact .deal .m{font-size:11px;margin-top:3px}
  .board.compact .deal .m span{display:none}
  .board.compact .deal .actions{display:none}
  .board.compact .deal:hover .actions{display:flex}

  /* modal */
  .veil{position:fixed;inset:0;background:rgba(12,16,28,.45);display:flex;align-items:flex-start;
        justify-content:center;padding:40px 16px;overflow:auto;z-index:50}
  .modal{background:var(--modal-bg);border-radius:12px;width:100%;max-width:680px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
  .modal.wide{max-width:860px}
  .modal .hd{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center}
  .modal .hd h2{margin:0;font-size:16px}
  .modal .bd{padding:18px;max-height:66vh;overflow:auto}
  .modal .ft{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}

  .toast{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:99}
  .toast div{background:var(--toast-bg);color:var(--toast-ink);padding:10px 14px;border-radius:9px;box-shadow:var(--shadow);
    display:flex;align-items:center;gap:10px;max-width:340px}
  .toast div button{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:5px 12px;
    font-weight:600;cursor:pointer;white-space:nowrap}
  .toast div button:hover{opacity:.88}
  .toast div{font-size:13px;animation:pop .18s ease}
  .undoing td{opacity:.5;transition:opacity .3s}
  .undocount{display:inline-block;min-width:20px;text-align:center;font-weight:700;opacity:.75;font-variant-numeric:tabular-nums;margin-right:2px}
  .unseen td{font-weight:700}
  @keyframes pop{from{transform:translateY(6px);opacity:0}}

  .banner{background:var(--banner-bg);border:1px solid var(--banner-line);color:var(--banner-ink);border-radius:9px;padding:9px 13px;
          font-size:12.5px;margin-bottom:16px}
  .doc{border:1px solid var(--line);border-radius:10px;padding:22px}
  .doc h3{margin:0 0 2px;font-size:20px}
  .split{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
  @media(max-width:1000px){.split{grid-template-columns:1fr}}
  @media(max-width:760px){
    body{display:block} aside{width:100%;flex:none;min-height:0;flex-direction:row;overflow-x:auto;align-items:center}
    aside .grp,.sidefoot,.logo{display:none} main{height:auto}
  }
  .tl{list-style:none;margin:0;padding:0}
  .tl li{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px}
  .tl li:last-child{border:0}
  .tl .dot{width:8px;height:8px;border-radius:50%;background:var(--brand);margin-top:6px;flex:0 0 8px}
  .tl time{color:var(--muted);font-size:11.5px;margin-left:auto;white-space:nowrap}
  .items th,.items td{padding:8px 10px}
  .items input{padding:6px 8px}

  /* list search/filter toolbar */
  .listbar{display:flex;gap:8px;margin-bottom:12px;max-width:560px}
  .listbar input{flex:1}
  .listbar select{width:auto}
  .nomatches{text-align:center;color:var(--muted);padding:18px}

  /* print / PDF — only the .print-area is visible on paper */
  @media print{
    body{background:#fff}
    aside,header,.toast,#login,.listbar{display:none !important}
    body *{visibility:hidden}
    .print-area,.print-area *{visibility:visible}
    .print-area{position:absolute;left:0;top:0;width:100%;border:0;box-shadow:none}
    .split{display:block}
    .card{box-shadow:none;border:0}
  }
</style>
</head>
<body>
<aside id="aside">
  <div class="logo"><i></i> Nimbus CRM</div>
  <a href="#/dashboard"><span data-i18n="nav.dashboard">Dashboard</span></a>
  <button class="grp" data-grp="sales" onclick="toggleGrp('sales')"><span data-i18n="grp.sales">Sales</span><i class="chev">▾</i></button>
  <div class="grp-items" id="grp-sales">
    <a href="#/pipeline"><span data-i18n="nav.pipeline">Pipeline</span> <span class="count" data-c="deals"></span></a>
    <a href="#/companies"><span data-i18n="nav.companies">Customer list</span></a>
    <a href="#/quotes"><span data-i18n="nav.quotes">Offers &amp; Quotes</span> <span class="count" data-c="quotes"></span></a>
  </div>
  <button class="grp" data-grp="revenue" onclick="toggleGrp('revenue')"><span data-i18n="grp.revenue">Revenue</span><i class="chev">▾</i></button>
  <div class="grp-items" id="grp-revenue">
    <a href="#/invoices"><span data-i18n="nav.invoices">Invoices</span> <span class="count" data-c="invoices"></span></a>
    <a href="#/payments"><span data-i18n="nav.payments">Payments</span> <span class="count" data-c="payments"></span></a>
  </div>
  <button class="grp" data-grp="system" onclick="toggleGrp('system')"><span data-i18n="grp.system">System</span><i class="chev">▾</i></button>
  <div class="grp-items" id="grp-system">
    <a href="#/email"><span data-i18n="nav.email">Email</span></a>
    <a href="#/automation"><span data-i18n="nav.automation">Automation log</span></a>
    <a href="#/profile"><span data-i18n="nav.profile">Profile</span></a>
    <a href="#/users" id="nav-users" style="display:none"><span data-i18n="nav.users">Users</span></a>
    <a href="#/portal"><span data-i18n="nav.portal">Client portal preview</span></a>
    <a href="#/trash"><span data-i18n="nav.trash">Trash</span></a>
  </div>
  <div class="sidefoot">
    <div data-i18n="side.demo">Demo build — data lives in your Supabase database. No real emails, no real payments.</div>
    <div style="margin-top:8px;display:flex;gap:6px">
      <button class="sm ghost" id="resetbtn" data-i18n="side.reset" onclick="resetDemo()">Reset demo data</button>
      <button class="sm ghost" id="logoutbtn" style="display:none" data-i18n="side.logout" onclick="logout()">Log out</button>
    </div>
  </div>
</aside>

<main>
  <header>
    <div>
      <h1 id="ttl">Dashboard</h1>
      <div class="sub" id="sub"></div>
    </div>
    <div class="right"><span id="acts"></span><select id="currsel" onchange="changeCurr(this.value)"></select><button id="themebtn" class="sm themebtn" onclick="toggleTheme()" title=""></button><button id="langbtn" class="sm" onclick="toggleLang()"></button></div>
  </header>
  <div class="scroll" id="view"></div>
</main>
<div class="toast" id="toast"></div>

<div id="login" style="display:none">
  <button class="sm ghost themebtn" onclick="toggleTheme()" style="position:fixed;top:16px;right:16px;z-index:61" title=""></button>
  <div class="login-card">
    <div class="logo" style="justify-content:center;padding:0 0 4px"><i></i> Nimbus CRM</div>
    <h2 id="login-title" data-i18n="login.title">Log in</h2>
    <form id="login-form">
      <div class="field"><label data-i18n="login.email">Email</label><input type="email" id="login-email" autocomplete="email" required></div>
      <div class="field"><label data-i18n="login.pass">Password</label><input type="password" id="login-pass" autocomplete="current-password" required></div>
      <div class="login-err" id="login-err" style="display:none"></div>
      <button class="primary" type="submit" style="width:100%" data-i18n="login.btn">Log in</button>
    </form>
    <p class="muted" style="font-size:12px;text-align:center;margin:12px 0 0" data-i18n="login.hint">Accounts are created by an administrator.</p>
  </div>
</div>

<script src="supabase-config.js?v=36"></script>
<script src="supabase-js.js?v=36"></script>
<script src="app.js?v=36"></script>
</body>
</html>
